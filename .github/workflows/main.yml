name: Build

on:
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ wayland-protocols libwayland-dev

      - name: Build project
        run: bash ./build.sh

      - name: Get binary
        uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: build/Software
          if-no-files-found: error
